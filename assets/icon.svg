<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25105f"/>
      <stop offset="55%" stop-color="#100b35"/>
      <stop offset="100%" stop-color="#05091d"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9b5ff"/>
      <stop offset="50%" stop-color="#9560ff"/>
      <stop offset="100%" stop-color="#5622dc"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1a5"/>
      <stop offset="100%" stop-color="#e5a51b"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100"
        fill="none" stroke="#8754ff" stroke-width="5" opacity=".8"/>

  <circle cx="256" cy="260" r="175"
          fill="#6129e8" opacity=".12"/>

  <!-- التاج -->
  <path d="M178 151 L150 94 L215 125 L256 67
           L297 125 L362 94 L334 151 Z"
        fill="url(#gold)" stroke="#ffdf76" stroke-width="7"
        stroke-linejoin="round" filter="url(#glow)"/>

  <circle cx="150" cy="91" r="10" fill="#fff1a5"/>
  <circle cx="256" cy="65" r="11" fill="#fff1a5"/>
  <circle cx="362" cy="91" r="10" fill="#fff1a5"/>

  <!-- حرف H -->
  <path d="M164 190 H224 V255 H288 V190 H348
           V355 H288 V303 H224 V355 H164 Z"
        fill="url(#purple)" stroke="#e4caff"
        stroke-width="5" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- المدار -->
  <ellipse cx="256" cy="277" rx="190" ry="66"
           transform="rotate(-23 256 277)"
           fill="none" stroke="url(#purple)"
           stroke-width="12" opacity=".95"/>

  <path d="M385 211 L405 190 L398 224 Z"
        fill="#d8aaff"/>

  <circle cx="105" cy="344" r="7" fill="#c89cff"/>
  <circle cx="405" cy="340" r="6" fill="#c89cff"/>

</svg>
