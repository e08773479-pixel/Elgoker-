
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b27">
  <meta name="description" content="حمّل وثبّت HENO CHAT على هاتفك واستمتع بتجربة تواصل بلا حدود.">

  <title>تحميل HENO CHAT</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #422078 0, transparent 38%),
        radial-gradient(circle at 85% 75%, #22216b 0, transparent 35%),
        #090817;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 16px;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 470px;
      text-align: center;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 240px;
      height: 240px;
      background: #8654ff;
      filter: blur(120px);
      opacity: .22;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .card {
      position: relative;
      padding: 34px 23px;
      border: 1px solid rgba(177, 139, 255, .25);
      border-radius: 30px;
      background: rgba(24, 19, 48, .77);
      backdrop-filter: blur(25px);
      box-shadow: 0 25px 80px rgba(0,0,0,.4);
    }

    .logo {
      width: 112px;
      height: 112px;
      object-fit: contain;
      border-radius: 28px;
      filter: drop-shadow(0 0 25px rgba(145, 95, 255, .5));
      margin-bottom: 19px;
    }

    h1 {
      font-size: 31px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .tagline {
      color: #c8b8f3;
      font-size: 15px;
      margin-top: 9px;
    }

    .description {
      color: #bcb5d1;
      font-size: 13px;
      line-height: 2;
      margin: 22px 0;
    }

    .install-btn {
      width: 100%;
      min-height: 58px;
      border: none;
      border-radius: 17px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      font-family: inherit;
      background: linear-gradient(110deg, #a477ff, #6941e8);
      box-shadow: 0 10px 30px rgba(123, 76, 255, .35);
      cursor: pointer;
      transition: .2s;
    }

    .install-btn:active {
      transform: scale(.97);
    }

    .install-btn:disabled {
      opacity: .7;
      cursor: default;
    }

    .status {
      min-height: 48px;
      margin-top: 15px;
      color: #d4c9f0;
      font-size: 12px;
      line-height: 1.9;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 25px;
    }

    .feature {
      padding: 14px 5px;
      border-radius: 15px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.07);
    }

    .feature .symbol {
      display: block;
      color: #b99aff;
      font-size: 22px;
      margin-bottom: 9px;
    }

    .feature span:last-child {
      font-size: 11px;
      color: #d4cde5;
    }

    .instructions {
      display: none;
      text-align: right;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(180,150,255,.2);
      padding: 17px;
      border-radius: 17px;
      margin-top: 16px;
      font-size: 13px;
      line-height: 2.2;
      color: #ded5f5;
    }

    .instructions.show {
      display: block;
    }

    .instructions strong {
      color: #c5a7ff;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: #c5adff;
      font-size: 13px;
      text-decoration: none;
    }

    .footer {
      margin-top: 20px;
      color: #817995;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main class="page">
    <div class="glow"></div>

    <section class="card">

      <img class="logo"
           src="./assets/icon.svg"
           alt="HENO CHAT">

      <h1>HENO CHAT</h1>
      <p class="tagline">تواصل بلا حدود</p>

      <p class="description">
        عالمك الخاص للتواصل والمحادثات.
        ثبّت HENO CHAT على هاتفك واستمتع
        بالوصول السريع من الشاشة الرئيسية.
      </p>

      <button class="install-btn" id="installButton">
        ↓ &nbsp; ثبّت HENO CHAT الآن
      </button>

      <div class="status" id="installStatus" aria-live="polite">
        تطبيقك المفضل أصبح أقرب إليك.
      </div>

      <div class="instructions" id="instructions"></div>

      <div class="features">
        <div class="feature">
          <span class="symbol">✦</span>
          <span>تصميم فاخر</span>
        </div>

        <div class="feature">
          <span class="symbol">◈</span>
          <span>وصول سريع</span>
        </div>

        <div class="feature">
          <span class="symbol">⌂</span>
          <span>على شاشتك</span>
        </div>
      </div>

      <a class="back" href="./index.html">
        العودة إلى HENO CHAT ←
      </a>

    </section>

    <p class="footer">
      HENO CHAT © 2026 — تواصل بلا حدود
    </p>
  </main>

  <script>
    (() => {
      const button = document.getElementById("installButton");
      const status = document.getElementById("installStatus");
      const instructions = document.getElementById("instructions");

      let installPrompt = null;

      const isInstalled = () =>
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      function showInstructions(title, content) {
        instructions.innerHTML =
          "<strong>" + title + "</strong><br>" + content;

        instructions.classList.add("show");
      }

      if (isInstalled()) {
        button.textContent = "✓ التطبيق مثبت بالفعل";
        button.disabled = true;
        status.textContent = "يمكنك فتح HENO CHAT من شاشة هاتفك.";
      }

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        installPrompt = event;

        button.disabled = false;
        button.textContent = "↓ تثبيت HENO CHAT الآن";
        status.textContent = "جاهز للتثبيت على جهازك.";
      });

      button.addEventListener("click", async () => {
        if (isInstalled()) return;

        if (installPrompt) {
          installPrompt.prompt();

          const result = await installPrompt.userChoice;

          if (result.outcome === "accepted") {
            status.textContent = "تم قبول طلب التثبيت. أكمل تأكيد المتصفح.";
          } else {
            status.textContent = "لم يتم التثبيت. يمكنك المحاولة مرة أخرى.";
          }

          installPrompt = null;
          return;
        }

        const ua = navigator.userAgent;
        const isIOS = /iphone|ipad|ipod/i.test(ua);
        const isAndroid = /android/i.test(ua);

        if (isIOS) {
          showInstructions(
            "تثبيت HENO CHAT على iPhone",
            "1. افتح الصفحة في Safari.<br>" +
            "2. اضغط زر المشاركة.<br>" +
            "3. اختر إضافة إلى الشاشة الرئيسية.<br>" +
            "4. اضغط إضافة."
          );
        } else if (isAndroid) {
          showInstructions(
            "تثبيت HENO CHAT على Android",
            "1. افتح الصفحة في Chrome.<br>" +
            "2. افتح قائمة المتصفح ⋮.<br>" +
            "3. اختر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية.<br>" +
            "4. أكّد الإضافة."
          );
        } else {
          showInstructions(
            "تثبيت التطبيق",
            "افتح قائمة المتصفح وابحث عن خيار تثبيت التطبيق أو إضافته إلى الشاشة الرئيسية."
          );
        }
      });

      window.addEventListener("appinstalled", () => {
        button.textContent = "✓ تم تثبيت HENO CHAT";
        button.disabled = true;
        status.textContent = "أصبح التطبيق جاهزًا على هاتفك.";
        instructions.classList.remove("show");
      });

      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js")
            .catch(error => {
              console.error("Service Worker:", error);
            });
        });
      }

      if (location.protocol !== "https:" &&
          location.hostname !== "localhost") {
        status.textContent =
          "يجب نشر الموقع على HTTPS حتى تتوفر إمكانية تثبيت التطبيق.";
        button.disabled = true;
      }
    })();
  </script>

</body>
</html>
